services:
  - type: web
    name: bharosa-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://bharosa.vercel.app
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bharosa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bharosa-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

  - type: worker
    name: bharosa-indexer
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run reindex
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bharosa-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bharosa-redis
          property: connectionString

databases:
  - name: bharosa-postgres
    databaseName: bharosa_db
    user: bharosa_user

  - name: bharosa-redis
    plan: free
