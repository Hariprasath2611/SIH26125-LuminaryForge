services:
  # Bharosa API & Production Static Server
  - type: web
    name: bharosa-api
    env: node
    plan: standard
    buildCommand: npm install && npm run build --prefix backend && npm run build --prefix frontend
    startCommand: npm run start --prefix backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVE_FRONTEND
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: bharosa-postgres
          property: connectionString

databases:
  - name: bharosa-postgres
    databaseName: bharosa_db
    user: bharosa_user
    plan: standard
