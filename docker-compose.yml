version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bharosa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bharosa_user
      POSTGRES_PASSWORD: bharosa_password
      POSTGRES_DB: bharosa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharosa_user -d bharosa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: bharosa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Kubo IPFS Node
  kubo:
    image: ipfs/kubo:v0.28.0
    container_name: bharosa-ipfs
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8080:8080"
    environment:
      IPFS_PATH: /data/ipfs
    volumes:
      - ipfs_data:/data/ipfs

  # 4. Hardhat Local Blockchain Node + Deploy + Seed
  chain:
    image: node:20-alpine
    container_name: bharosa-chain
    restart: unless-stopped
    working_dir: /app/blockchain
    volumes:
      - .:/app
    ports:
      - "8545:8545"
    command: >
      sh -c "npm install &&
             npx hardhat node --hostname 0.0.0.0 &
             sleep 5 &&
             npx hardhat run scripts/deploy.ts --network localhost &&
             npx hardhat run scripts/seed-demo.ts --network localhost &&
             tail -f /dev/null"

  # 5. Express API Backend Service
  backend:
    image: node:20-alpine
    container_name: bharosa-backend
    restart: unless-stopped
    working_dir: /app/backend
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DEMO_MODE=true
      - DATABASE_URL=postgresql://bharosa_user:bharosa_password@postgres:5432/bharosa_db?schema=public
      - REDIS_URL=redis://redis:6379
      - RPC_URL=http://chain:8545
      - CORS_ORIGINS=http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chain:
        condition: service_started
    command: sh -c "npm install && npm run dev"

  # 6. React 18 + Vite Frontend Application
  frontend:
    image: node:20-alpine
    container_name: bharosa-frontend
    restart: unless-stopped
    working_dir: /app/frontend
    volumes:
      - .:/app
    environment:
      - VITE_API_URL=/v1
      - VITE_RPC_URL=http://localhost:8545
      - VITE_CHAIN_ID=31337
      - VITE_DEMO_MODE=true
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - chain
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  redis_data:
  ipfs_data:
