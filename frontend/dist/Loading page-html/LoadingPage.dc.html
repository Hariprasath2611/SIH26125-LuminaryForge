<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bharosa – Loading</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;color:#1A2E05;background:#FFFFFF}
*{box-sizing:border-box}
.ld{position:relative;min-height:800px;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;background:radial-gradient(circle at 50% 34%,#F4FBE3,#FFFFFF 68%)}
.sr{position:absolute;left:-9999px}
.hc{position:absolute;left:50%;top:50%;width:0;height:0;z-index:-1}
.hx{position:absolute}
.hx polygon{fill:rgba(255,255,255,.6);stroke:#E3F1C4;stroke-width:1.5;animation:wv 6s ease-in-out infinite;animation-delay:var(--d)}
.seal{position:relative;width:240px;height:240px;margin-bottom:8px}
.glow{position:absolute;left:50%;top:50%;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%;background:radial-gradient(circle,rgba(163,230,53,.55),rgba(163,230,53,0) 68%);animation:gl 6s ease-in-out infinite}
.sv{position:relative;display:block;overflow:visible}
.orb{transform-box:view-box;transform-origin:120px 120px;animation:orb 14s linear infinite}
.pls{transform-box:view-box;transform-origin:120px 120px;opacity:0;animation:pl 6s ease-out infinite}
.out{animation:dr 6s ease-in-out infinite}
.sf{transform-box:view-box;transform-origin:120px 120px;animation:fl 6s cubic-bezier(.2,1.3,.4,1) infinite}
.scn{animation:sc 6s ease-in-out infinite}
.ck{animation:ck 6s ease-in-out infinite}
.nd{fill:#84CC16;stroke:#FFFFFF;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:nd 6s ease-out infinite}
.wm{font-weight:800;font-size:56px;line-height:64px;letter-spacing:-1.5px;animation:wm 6s ease-out infinite}
.tg{font-weight:600;font-size:18px;line-height:26px;color:#4D6B2A;letter-spacing:.3px;margin-bottom:28px;animation:wm 6s ease-out infinite}
.steps{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.row{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;line-height:22px;color:#3F5A1E}
.ico{position:relative;flex:0 0 auto;width:24px;height:24px}
.ico i,.ico svg{position:absolute;inset:0}
.spin{border:3px solid #D9EBB5;border-top-color:#84CC16;border-radius:50%;opacity:0;animation:rot .8s linear infinite,var(--sn) 6s linear infinite}
.dn{border-radius:50%;background:#84CC16;display:flex;align-items:center;justify-content:center;animation:var(--cn) 6s ease-out infinite}
.dn svg{position:static;width:14px;height:14px;fill:none;stroke:#1A2E05;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.bar{position:relative;width:340px;max-width:100%;height:8px;border-radius:8px;background:#E7F2CF;overflow:hidden;animation:bo 6s linear infinite}
.bar i{width:100%;position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#A3E635,#84CC16);animation:pg 6s cubic-bezier(.4,0,.2,1) infinite}
.bar i::after{content:'';position:absolute;top:0;bottom:0;right:0;width:50px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);animation:sh 1.2s ease-in-out infinite}
.note{position:absolute;left:0;right:0;bottom:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:13px;line-height:20px;color:#4D6B2A}
.note svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fp{position:absolute;z-index:-1;bottom:-30px;width:18px;height:20px;background:#BEF264;opacity:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:up 9s linear infinite;animation-delay:var(--w)}

@keyframes wv{0%,36%{fill:rgba(255,255,255,.6);stroke:#E3F1C4}42%{fill:#D9F99D;stroke:#84CC16}58%{fill:#F4FBE3;stroke:#D9EBB5}70%,100%{fill:rgba(255,255,255,.6);stroke:#E3F1C4}}
@keyframes dr{0%{stroke-dashoffset:540;opacity:1}16%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes fl{0%,16%{transform:scale(0);opacity:0}28%{transform:scale(1.08);opacity:1}32%,90%{transform:scale(1);opacity:1}96%,100%{transform:scale(.9);opacity:0}}
@keyframes ck{0%,27%{stroke-dashoffset:95;opacity:1}36%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes pl{0%,36%{opacity:0;transform:scale(1)}39%{opacity:.85}56%,100%{opacity:0;transform:scale(2.3)}}
@keyframes nd{0%,4%{transform:scale(0)}10%{transform:scale(1.5)}15%,90%{transform:scale(1)}96%,100%{transform:scale(0)}}
@keyframes sc{0%,40%{transform:translateY(-70px)}80%,100%{transform:translateY(150px)}}
@keyframes gl{0%,30%{opacity:.15;transform:scale(.8)}42%{opacity:.95;transform:scale(1.1)}100%{opacity:.35;transform:scale(1)}}
@keyframes orb{to{transform:rotate(360deg)}}
@keyframes wm{0%,30%{opacity:0;transform:translateY(14px)}42%,90%{opacity:1;transform:none}96%,100%{opacity:0;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes s1{0%{opacity:1}20%{opacity:1}22%,100%{opacity:0}}
@keyframes s2{0%,18%{opacity:0}20%,38%{opacity:1}40%,100%{opacity:0}}
@keyframes s3{0%,36%{opacity:0}38%,56%{opacity:1}58%,100%{opacity:0}}
@keyframes s4{0%,54%{opacity:0}56%,74%{opacity:1}76%,100%{opacity:0}}
@keyframes c1{0%,20%{transform:scale(0);opacity:0}26%{transform:scale(1.25);opacity:1}30%,92%{transform:scale(1);opacity:1}98%,100%{opacity:0}}
@keyframes c2{0%,38%{transform:scale(0);opacity:0}44%{transform:scale(1.25);opacity:1}48%,92%{transform:scale(1);opacity:1}98%,100%{opacity:0}}
@keyframes c3{0%,56%{transform:scale(0);opacity:0}62%{transform:scale(1.25);opacity:1}66%,92%{transform:scale(1);opacity:1}98%,100%{opacity:0}}
@keyframes c4{0%,74%{transform:scale(0);opacity:0}80%{transform:scale(1.25);opacity:1}84%,92%{transform:scale(1);opacity:1}98%,100%{opacity:0}}
@keyframes pg{0%{width:0}84%,100%{width:100%}}
@keyframes bo{0%,92%{opacity:1}98%,100%{opacity:0}}
@keyframes sh{0%{opacity:0;transform:translateX(-30px)}50%{opacity:1}100%{opacity:0;transform:translateX(30px)}}
@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(-880px) rotate(120deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.spin{display:none}
}
</style>
</helmet>
<div class="ld" role="status" aria-live="polite" aria-busy="true">
<span class="sr">Loading Bharosa. Verifying your session.</span>
<i class="fp" style="left:10%;--w:0s"></i><i class="fp" style="left:24%;--w:2.5s"></i><i class="fp" style="left:38%;--w:5s"></i><i class="fp" style="left:62%;--w:1.2s"></i><i class="fp" style="left:78%;--w:3.8s"></i><i class="fp" style="left:90%;--w:6.4s"></i>

<div class="seal">
<div class="hc" aria-hidden="true">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="200"><svg class="hx" style="{{c.s}}" viewBox="0 0 76.2 88" width="76.2" height="88"><polygon points="38.1,1 75.2,22.5 75.2,65.5 38.1,87 1,65.5 1,22.5"></polygon></svg></sc-for>
</div>
<div class="glow" aria-hidden="true"></div>
<svg class="sv" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Bharosa seal assembling">
<defs>
<linearGradient id="ldg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BEF264"></stop><stop offset="1" stop-color="#65A30D"></stop></linearGradient>
<linearGradient id="lds" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".75"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>
<clipPath id="ldc"><polygon points="120,48 182.4,84 182.4,156 120,192 57.6,156 57.6,84"></polygon></clipPath>
</defs>
<circle class="orb" cx="120" cy="120" r="112" fill="none" stroke="#84CC16" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"></circle>
<polygon class="pls" points="120,30 197.9,75 197.9,165 120,210 42.1,165 42.1,75" fill="none" stroke="#84CC16" stroke-width="2"></polygon>
<polygon class="out" points="120,30 197.9,75 197.9,165 120,210 42.1,165 42.1,75" fill="none" stroke="#65A30D" stroke-width="4" stroke-linejoin="round" stroke-dasharray="540"></polygon>
<g class="sf"><polygon points="120,48 182.4,84 182.4,156 120,192 57.6,156 57.6,84" fill="url(#ldg)"></polygon><g clip-path="url(#ldc)"><rect class="scn" x="57" y="40" width="126" height="60" fill="url(#lds)"></rect></g></g>
<path class="ck" d="M88 122 L110 144 L152 98" fill="none" stroke="#1A2E05" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="95"></path>
<circle class="nd" cx="120" cy="30" r="6" style="animation-delay:.0s"></circle><circle class="nd" cx="197.9" cy="75" r="6" style="animation-delay:.08s"></circle><circle class="nd" cx="197.9" cy="165" r="6" style="animation-delay:.16s"></circle>
<circle class="nd" cx="120" cy="210" r="6" style="animation-delay:.24s"></circle><circle class="nd" cx="42.1" cy="165" r="6" style="animation-delay:.32s"></circle><circle class="nd" cx="42.1" cy="75" r="6" style="animation-delay:.4s"></circle>
</svg>
</div>

<div class="wm">Bharosa</div>
<div class="tg">Trust, owned by you.</div>

<div class="steps">
<div class="row"><span class="ico"><i class="spin" style="--sn:s1"></i><i class="dn" style="--cn:c1"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></i></span>Connecting to Polygon Amoy</div>
<div class="row"><span class="ico"><i class="spin" style="--sn:s2"></i><i class="dn" style="--cn:c2"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></i></span>Resolving your decentralized ID</div>
<div class="row"><span class="ico"><i class="spin" style="--sn:s3"></i><i class="dn" style="--cn:c3"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></i></span>Checking credentials on-chain</div>
<div class="row"><span class="ico"><i class="spin" style="--sn:s4"></i><i class="dn" style="--cn:c4"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></i></span>Securing your encryption keys</div>
</div>
<div class="bar" aria-hidden="true"><i></i></div>

<div class="note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path></svg>Your keys never leave your wallet.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const N = 9, s = 44, W = Math.sqrt(3) * s, cells = [];
for (let q = -N; q <= N; q++) {
for (let r = -N; r <= N; r++) {
if (Math.max(Math.abs(q), Math.abs(r), Math.abs(-q - r)) > N) continue;
const x = W * (q + r / 2), y = 1.5 * s * r;
if (Math.abs(x) > 720 || Math.abs(y) > 640) continue;
const k = Math.min(1, Math.hypot(x, y) / 760);
cells.push({ s: 'left:' + (x - W / 2).toFixed(1) + 'px;top:' + (y - s).toFixed(1) + 'px;--d:' + (k * 1.8).toFixed(2) + 's;opacity:' + (1 - k * 0.55).toFixed(2) });
}
}
return { cells };
}
}
</script>
</body>
</html>
